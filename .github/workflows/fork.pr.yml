name: Fork PR

# Personal-fork check for pull requests: builds the home-server bundle the
# way a release does and boots it. Upstream's own workflows are meant for
# standardnotes/server (secrets, Docker Hub, npm) and should stay disabled.

on:
  pull_request:
    branches: [main]

concurrency:
  group: fork-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bundle:
    if: github.repository != 'standardnotes/server'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build in Alpine
        run: |
          docker run --rm -v "$PWD:/repo" alpine:3 sh /repo/selfhost/home-server/build-bundle.sh /repo/out
      - name: Boot test
        run: sh selfhost/home-server/boot-test.sh out
